<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - SmartQuiz</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="blue-page">
    <div class="brand-name">SmartQuiz</div>
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>

    <div class="login-card">

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash-message">
                    {% for message in messages %}
                        <p>⚠️ {{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <h1>Forgot Password?</h1>
        <p class="subtitle">Enter your email, we'll send a reset link</p>

        <form method="POST" action="/forgot-password">
            <label>Email</label>
            <input type="email" name="email" placeholder="Enter your email" required>

            <button type="submit" class="pill-btn primary">Send Reset Link</button>
        </form>

        <a href="/login" class="pill-btn secondary">Back to Login</a>

    </div>
</div>

</body>
</html>
