<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - SmartQuiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{
            margin:0; padding:0; box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }
        html, body{
            height:100%;
        }
        body{
            position:relative;
            min-height:100%;
            background: linear-gradient(180deg, #7dd3fc, #38bdf8);
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            padding:24px;
        }
        .photo-card{
            width:100%;
            max-width:560px;
            border-radius:18px;
            box-shadow:0 20px 40px rgba(0,0,0,0.25);
            opacity:0;
            transform: scale(0.9);
            animation: popIn 0.6s cubic-bezier(.34,1.56,.64,1) forwards;
        }
        @keyframes popIn{
            to{ opacity:1; transform: scale(1); }
        }

        @keyframes fadeUp{
            from{opacity:0; transform:translateY(15px);}
            to{opacity:1; transform:translateY(0);}
        }

        .continue-btn{
            display:inline-block;
            margin-top:26px;
            padding:13px 34px;
            background:white;
            color:#0284c7;
            font-weight:700;
            font-size:15px;
            border:none;
            border-radius:30px;
            text-decoration:none;
            cursor:pointer;
            box-shadow:0 8px 20px rgba(0,0,0,0.2);
            transition:0.25s;
            opacity:0;
            animation: fadeUp 0.7s ease forwards 0.4s;
        }
        .continue-btn:hover{
            transform: translateY(-3px);
            box-shadow:0 12px 24px rgba(0,0,0,0.25);
        }
    </style>
</head>
<body>

<img class="photo-card" src="{{ url_for('static', filename='images/1000134313.jpg') }}" alt="Quiz">

<a href="{{ url_for('dashboard') }}" class="continue-btn">Continue to Dashboard →</a>

</body>
</html>
